<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;family=Inter:wght@400;600;700&amp;display=swap');
      .fm{font-family:'Fira Code',monospace}.fs{font-family:'Inter',sans-serif}

      /* Cursor right click action */
      @keyframes cursorMotion {
        0%, 100% { transform: translate(180px, 200px); }
        12.5% { transform: translate(130px, 120px); } /* Right click spot */
        25%, 90% { transform: translate(180px, 200px); }
      }
      .cursor-node { animation: cursorMotion 12s ease-in-out infinite; }

      /* Right-click block alert */
      @keyframes rightClickBlock {
        0%, 11.5%, 26% { opacity: 0; transform: scale(0.8); }
        12.5%, 25% { opacity: 1; transform: scale(1); }
      }
      .rc-alert { animation: rightClickBlock 12s cubic-bezier(0.25, 1, 0.5, 1) infinite; }

      /* Shortcut override alert */
      @keyframes shortcutBlock {
        0%, 35%, 52% { opacity: 0; transform: scale(0.8); }
        37.5%, 50% { opacity: 1; transform: scale(1); }
      }
      .sc-alert { animation: shortcutBlock 12s cubic-bezier(0.25, 1, 0.5, 1) infinite; }

      /* DevTools Panel Slide Up */
      @keyframes devtoolsMove {
        0%, 58.3% { transform: translateY(240px); }
        66.7%, 87.5% { transform: translateY(160px); }
        91.7%, 100% { transform: translateY(240px); }
      }
      .dt-panel { animation: devtoolsMove 12s cubic-bezier(0.25, 1, 0.5, 1) infinite; }

      /* Debugger Pause Flash */
      @keyframes pauseFlash {
        0%, 64.6%, 89.6%, 100% { opacity: 0; }
        66.7%, 87.5% { opacity: 1; }
      }
      .dbg-pause { animation: pauseFlash 12s step-end infinite; }

      @keyframes pulseDbg {
        0%, 100% { fill: #ef4444; filter: drop-shadow(0 0 2px rgba(239,68,68,0.4)); }
        50% { fill: #b91c1c; filter: drop-shadow(0 0 10px rgba(239,68,68,0.8)); }
      }
      .alert-red { animation: pulseDbg 1s infinite; }

      /* Typewriter CLI commands */
      @keyframes type1 { 0%, 5% { width: 0; } 18%, 100% { width: 180px; } }
      @keyframes type2 { 0%, 40% { width: 0; } 58%, 100% { width: 155px; } }
      .cmd1 { animation: type1 12s linear infinite; }
      .cmd2 { animation: type2 12s linear infinite; }

      @keyframes cursor1Move {
        0%, 5% { transform: translateX(0); opacity: 1; }
        18% { transform: translateX(180px); opacity: 1; }
        22%, 100% { transform: translateX(180px); opacity: 0; }
      }
      @keyframes cursor2Move {
        0%, 40% { transform: translateX(0); opacity: 0; }
        41% { transform: translateX(0); opacity: 1; }
        58% { transform: translateX(155px); opacity: 1; }
        63%, 100% { transform: translateX(155px); opacity: 0; }
      }
      .cur1 { animation: cursor1Move 12s linear infinite, blink 1s step-end infinite; }
      .cur2 { animation: cursor2Move 12s linear infinite, blink 1s step-end infinite; }

      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

      /* Terminal logs timings */
      @keyframes showL1 { 0%, 21.9% { opacity: 0; } 22%, 100% { opacity: 1; } }
      @keyframes showL2 { 0%, 39.9% { opacity: 0; } 40%, 100% { opacity: 1; } }
      @keyframes showL3 { 0%, 59.9% { opacity: 0; } 60%, 100% { opacity: 1; } }
      @keyframes showL4 { 0%, 69.9% { opacity: 0; } 70%, 100% { opacity: 1; } }
      @keyframes showL5 { 0%, 82.9% { opacity: 0; } 83%, 100% { opacity: 1; } }
      @keyframes showL6 { 0%, 91.9% { opacity: 0; } 92%, 100% { opacity: 1; } }
      .log1 { animation: showL1 12s step-end infinite; }
      .log2 { animation: showL2 12s step-end infinite; }
      .log3 { animation: showL3 12s step-end infinite; }
      .log4 { animation: showL4 12s step-end infinite; }
      .log5 { animation: showL5 12s step-end infinite; }
      .log6 { animation: showL6 12s step-end infinite; }
    </style>

    <!-- Filters &amp; Shadows -->
    <filter id="ds"><feDropShadow dx="0" dy="6" stdDeviation="15" flood-color="#000" flood-opacity=".6"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="phone-clip">
      <rect x="80" y="60" width="220" height="240" rx="28" />
    </clipPath>

    <!-- UI Background Glow -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Typewriter clips -->
    <clipPath id="clip-c1"><rect class="cmd1" x="16" y="-8" width="0" height="20" /></clipPath>
    <clipPath id="clip-c2"><rect class="cmd2" x="16" y="36" width="0" height="20" /></clipPath>
  </defs>

  <!-- Base Canvas -->
  <rect fill="#04050a" width="860" height="520" rx="16" />
  <rect fill="url(#bg-glow)" width="860" height="520" rx="16" />

  <!-- Top Title -->
  <text class="fs" x="430" y="30" fill="#a78bfa" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="3" opacity="0.6">PROACTIVE BROWSER DEVTOOLS INHIBITION &amp; SHIELD</text>

  <!-- ════════════ COLUMN 1: DEVICE BROWSER SCREEN ════════════ -->
  <g transform="translate(0, 0)" filter="url(#ds)">
    <!-- Device Frame Outer -->
    <rect x="76" y="56" width="228" height="248" rx="32" fill="#1e1e24" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
    
    <!-- Render Area (Clipped Phone Screen) -->
    <g clip-path="url(#phone-clip)">
      <!-- Browser window workspace -->
      <rect x="80" y="60" width="220" height="240" fill="#0b0f19" />
      
      <!-- Mock website layout -->
      <rect x="92" y="72" width="196" height="18" rx="4" fill="#161b22" />
      <text class="fs" x="190" y="84" fill="#58a6ff" font-size="7.5" font-weight="600" text-anchor="middle">https://secure-app.com</text>
      
      <rect x="92" y="102" width="196" height="50" rx="6" fill="rgba(255,255,255,0.03)" />
      <text class="fs" x="104" y="120" fill="#ffffff" font-size="9" font-weight="700">Protected Portal</text>
      <text class="fs" x="104" y="134" fill="#8b949e" font-size="7" font-weight="500">Source code and elements protected.</text>
      
      <!-- Right click trigger alert -->
      <g class="rc-alert" transform="translate(130, 120)">
        <circle r="16" fill="rgba(239,68,68,0.15)" stroke="#ef4444" stroke-width="1.5" />
        <path d="M-5,-5 L5,5 M5,-5 L-5,5" fill="none" stroke="#ef4444" stroke-width="2" />
        <rect x="-55" y="20" width="110" height="16" rx="4" fill="#0d1117" stroke="rgba(239,68,68,0.3)" stroke-width="1" />
        <text class="fs" y="31" fill="#ef4444" font-size="7.5" font-weight="700" text-anchor="middle">Context Menu Blocked</text>
      </g>

      <!-- Keyboard shortcut trigger alert -->
      <g class="sc-alert" transform="translate(190, 150)">
        <rect x="-60" y="-12" width="120" height="24" rx="6" fill="#0d1117" stroke="#38bdf8" stroke-width="1" />
        <text class="fs" y="3" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Ctrl+Shift+I Blocked</text>
      </g>

      <!-- DevTools Panel sliding up -->
      <g class="dt-panel" transform="translate(80, 60)">
        <rect width="220" height="80" fill="#161b22" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
        <line x1="0" y1="0" x2="220" y2="0" stroke="#8b5cf6" stroke-width="2" />
        <text class="fm" x="12" y="18" fill="#8b949e" font-size="8.5" font-weight="700">Console</text>
        <text class="fm" x="65" y="18" fill="#8b949e" font-size="8.5" font-weight="700">Sources</text>
        
        <!-- Element tree mocks -->
        <text class="fm" x="12" y="38" fill="#ff7b72" font-size="8">&lt;div <tspan fill="#d2a8ff">id</tspan>=<tspan fill="#a5d6ff">"app"</tspan>&gt;</text>
        <text class="fm" x="24" y="52" fill="#ff7b72" font-size="8">&lt;span&gt;<tspan fill="#c9d1d9">Protected</tspan>&lt;/span&gt;</text>
        <text class="fm" x="12" y="66" fill="#ff7b72" font-size="8">&lt;/div&gt;</text>
      </g>

      <!-- Debugger Loop overlay (paused screen) -->
      <g class="dbg-pause">
        <rect x="80" y="60" width="220" height="240" fill="rgba(15,23,42,0.6)" />
        <circle cx="190" cy="180" class="alert-red" r="20" />
        <!-- Pause Bars -->
        <rect x="182" y="170" width="5" height="20" fill="#ffffff" rx="1.5" />
        <rect x="193" y="170" width="5" height="20" fill="#ffffff" rx="1.5" />
        <text class="fs" x="190" y="215" fill="#ef4444" font-size="8.5" font-weight="700" text-anchor="middle">DEBUGGER LOOP PAUSED</text>
      </g>

      <!-- Cursor Node (Animate pointer) -->
      <g class="cursor-node">
        <path d="M0,0 L0,14 L4,11 L8,18 L10,17 L6,10 L11,10 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
      </g>
    </g>

    <!-- Caption -->
    <text class="fs" x="190" y="325" fill="#a78bfa" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">DEVTOOLS DETECTED</text>
  </g>

  <!-- Flow connecting vector lines -->
  <line x1="310" y1="180" x2="540" y2="180" stroke="rgba(124, 92, 246, 0.25)" stroke-width="1.5" stroke-dasharray="4,4" />
  <polygon points="540,176 548,180 540,184" fill="#8b5cf6" opacity="0.6" />

  <!-- ════════════ COLUMN 3: ENGINE INHIBITOR AUDIT ════════════ -->
  <g transform="translate(550, 60)" filter="url(#ds)">
    <rect width="230" height="240" rx="12" fill="#0d1117" stroke="rgba(6, 182, 212, 0.2)" stroke-width="1.5" />
    <rect width="230" height="24" rx="12" fill="#161b22" />
    <rect y="16" width="230" height="8" fill="#161b22" />
    <text class="fs" x="115" y="15" fill="#8b949e" font-size="9" font-weight="600" text-anchor="middle">Active Defense Core</text>

    <g transform="translate(16, 42)">
      <!-- Status items -->
      <text class="fs" y="12" fill="#64748b" font-size="9" font-weight="600" letter-spacing="0.5">INHIBITORS STATUS</text>
      
      <!-- List status rows -->
      <g transform="translate(0, 24)">
        <circle cx="6" cy="6" r="4.5" fill="#10b981" />
        <text class="fs" x="18" y="9" fill="#8b949e" font-size="9.5">Right-Click hook: <tspan fill="#10b981" font-weight="600">Active</tspan></text>
      </g>
      <g transform="translate(0, 44)">
        <circle cx="6" cy="6" r="4.5" fill="#10b981" />
        <text class="fs" x="18" y="9" fill="#8b949e" font-size="9.5">Shortcut blockers: <tspan fill="#10b981" font-weight="600">Active</tspan></text>
      </g>
      <g transform="translate(0, 64)">
        <circle cx="6" cy="6" r="4.5" fill="#10b981" />
        <text class="fs" x="18" y="9" fill="#8b949e" font-size="9.5">Resize watcher: <tspan fill="#10b981" font-weight="600">Active</tspan></text>
      </g>

      <!-- Debugger loop status -->
      <g transform="translate(0, 94)">
        <text class="fs" y="12" fill="#64748b" font-size="9" font-weight="600" letter-spacing="0.5">DEBUGGER THREAD STATE</text>
        <g class="dbg-pause">
          <rect y="20" width="105" height="24" rx="4" fill="rgba(239, 68, 68, 0.08)" stroke="rgba(239, 68, 68, 0.2)" />
          <text class="fs" x="52" y="35" fill="#ef4444" font-size="9.5" font-weight="700" text-anchor="middle">ENGAGED</text>
        </g>
        <!-- Inactive state fallback -->
        <g class="status-settled">
          <rect y="20" width="105" height="24" rx="4" fill="rgba(255,255,255,0.04)" />
          <text class="fs" x="52" y="35" fill="#8b949e" font-size="9.5" font-weight="600" text-anchor="middle">STANDBY</text>
        </g>
      </g>

      <!-- Footer metadata box -->
      <rect y="156" width="198" height="44" rx="6" fill="rgba(6, 182, 212, 0.08)" stroke="rgba(6, 182, 212, 0.2)" />
      <text class="fs" x="12" y="172" fill="#06b6d4" font-size="9" font-weight="700">INSPECTION BARRIER</text>
      <text class="fs" x="12" y="186" fill="#8b949e" font-size="8" font-weight="500">Anti-DevTools Active Loop: 100ms</text>
    </g>
  </g>

  <!-- ════════════ BOTTOM PANEL: LIVE DEVELOPER TERMINAL ════════════ -->
  <g transform="translate(30, 310)" filter="url(#ds)">
    <rect width="800" height="186" rx="10" fill="rgba(13, 17, 23, 0.9)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect width="800" height="24" rx="10" fill="#161b22" />
    <rect y="16" width="800" height="8" fill="#161b22" />
    <circle cx="16" cy="12" r="4" fill="#ff5f56" /><circle cx="28" cy="12" r="4" fill="#ffbd2e" /><circle cx="40" cy="12" r="4" fill="#27c93f" />
    <text class="fs" x="400" y="16" fill="#8b949e" font-size="9" font-weight="600" text-anchor="middle">developer-console — react-stop-inspect</text>
    <line x1="0" y1="24" x2="800" y2="24" stroke="rgba(255,255,255,0.05)" stroke-width="1" />

    <!-- Terminal Output -->
    <g transform="translate(20, 32)">
      <!-- Line 1: npm install command -->
      <text class="fm" y="4" font-size="9.5" fill="#58a6ff" font-weight="700">❯</text>
      <text class="fm" x="16" y="4" font-size="9.5" fill="#c9d1d9" clip-path="url(#clip-c1)">npm install react-stop-inspect</text>
      <rect class="cur1" x="16" y="-7" width="6" height="12" fill="#58a6ff" />

      <!-- Success log after installation -->
      <g class="log1">
        <text class="fm" x="16" y="26" font-size="9.5" fill="#57ab5a">✔ Installed react-stop-inspect@1.0.2 (Webpack/Vite/Next.js protection hooks)</text>
      </g>

      <!-- Line 2: executing script -->
      <g class="log2">
        <text class="fm" y="48" font-size="9.5" fill="#58a6ff" font-weight="700">❯</text>
        <text class="fm" x="16" y="48" font-size="9.5" fill="#c9d1d9" clip-path="url(#clip-c2)">node run-inspect-shield.js</text>
        <rect class="cur2" x="16" y="37" width="6" height="12" fill="#58a6ff" />
      </g>

      <!-- Execution logs -->
      <g class="log3" transform="translate(16, 72)">
        <text class="fm" font-size="9.5" fill="#8b949e">[Stop Inspect] Initialized core browser hook inhibitors...</text>
      </g>
      <g class="log4" transform="translate(16, 92)">
        <text class="fm" font-size="9.5" fill="#ef4444">[BLOCKED] Right-click blocked at coordinates (130, 120)</text>
      </g>
      <g class="log5" transform="translate(16, 114)">
        <text class="fm" font-size="9.5" fill="#ef4444">[BLOCKED] Key combination blocked: Ctrl+Shift+I</text>
      </g>
      <g class="log6" transform="translate(16, 134)">
        <text class="fm" font-size="9.5" fill="#f43f5e" font-weight="700">[DETECTOR] DevTools opened. Entering infinite debugger loop. Engine paused.</text>
      </g>
    </g>
  </g>
</svg>
